name: ci

on:
  push:
    branches: [dev, prod, main, master]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run eval:sales
      - run: npm run build
        env:
          HERMES_API_KEY: ci-placeholder
          HERMES_GATEWAY_URL: http://127.0.0.1:8642/v1/chat/completions
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: readiness script loads
        run: node scripts/readiness.mjs || true
